<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grand Sumo Banzuke</title>
    <meta
      name="description"
      content="An unofficial English and Japanese viewer of the grand sumo banzuke: all six divisions, rank changes and daily results, from Japan Sumo Association data."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#d10010" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#a3000c" />
    <link rel="canonical" href="%SITE_URL%" />
    <meta property="og:title" content="Grand Sumo Banzuke" />
    <meta
      property="og:description"
      content="An unofficial English and Japanese viewer of the grand sumo banzuke: all six divisions, rank changes and daily results, from Japan Sumo Association data."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Grand Sumo Banzuke: the rankings sheet" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Grand Sumo Banzuke" />
    <meta
      name="twitter:description"
      content="An unofficial English and Japanese viewer of the grand sumo banzuke: all six divisions, rank changes and daily results, from Japan Sumo Association data."
    />
    <meta name="twitter:image" content="%SITE_URL%og-image.png" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Banzuke" />
    <meta name="application-name" content="Banzuke" />
    <!-- The banzuke the app fetches first (useBanzuke's DATA_URL): start it with the HTML, not after the JS -->
    <link rel="preload" as="fetch" href="%BASE_URL%latest-banzuke.json" crossorigin />
    <!-- Portraits are loaded only when a dialog opens: resolve the host early, connect on demand -->
    <link rel="dns-prefetch" href="https://www.sumo.or.jp" />
    <link
      rel="preload"
      href="%BASE_URL%assets/fonts/SofiaSansCondensed-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The core mincho only: the names face is fetched when a Japanese name is drawn -->
    <link
      rel="preload"
      href="%BASE_URL%assets/fonts/NotoSerifJP-700-core.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <!-- The page text for crawlers that do not run JavaScript (Bing often, AI search bots always) -->
    <noscript>
      <h1>Grand Sumo Banzuke</h1>
      <p lang="en">
        An unofficial English and Japanese viewer of the grand sumo banzuke, the official ranking
        sheet the Japan Sumo Association publishes before each tournament. It shows all six
        divisions, from Makuuchi to Jonokuchi, each wrestler's rise or fall from the last
        tournament, and the day-by-day results while a tournament is on.
      </p>
      <p lang="ja">
        大相撲の番付を英語と日本語で表示する非公式サイトです。幕内から序ノ口までの全六段、前場所からの昇降、本場所中の毎日の結果を、日本相撲協会のデータをもとに掲載しています。
      </p>
      <p lang="en">
        The viewer needs JavaScript. The data it draws is plain JSON:
        <a href="latest-banzuke.json">Makuuchi and Juryo</a> and
        <a href="latest-lower.json">Makushita to Jonokuchi</a>.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
